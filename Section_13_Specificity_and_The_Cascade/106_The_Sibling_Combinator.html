<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sibling Combinator Practice</title>

  <style>
    /* General Sibling Combinator */

    h2 ~ p {
      color: red;
      font-weight: bold;
    }

   
  </style>
</head>
<body>

  <h2>Heading</h2>

  <p>Paragraph 1 (selected)</p>
  <p>Paragraph 2 (selected)</p>
  <p>Paragraph 3 (selected)</p>

</body>
</html>
