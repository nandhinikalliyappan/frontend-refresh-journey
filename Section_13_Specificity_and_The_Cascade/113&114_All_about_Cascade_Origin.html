<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cascade example - Origin</title>
    <!-- AUTHOR STYLES (external / internal CSS) -->
    <style>
        p {
            color: green;
            font-size: 16px;
        }
    </style>
</head>

<body>
    <h2>CSS Origin Demonstration</h2>

    <!-- BROWSER (USER AGENT) STYLE -->
    <p>
        This paragraph has browser default styles,
        but author CSS overrides them → GREEN
    </p>

    <!-- INLINE STYLE (AUTHOR ORIGIN, STRONGER) -->
    <p style="color: red;">
        Inline style overrides author CSS → RED
    </p>
</body>

</html>
