<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pseudo-Classes Practice</title>

  <style>

    
    /* hover */
    button:hover {
      background-color: lightblue;
    }

    /* active */
    button:active {
      transform: scale(0.95);
    }

    /* focus (FIXED) */
    input {
      padding: 8px;
      border: 1px solid #999;
      outline: none;
    }

    input:focus {
      border: 2px solid green;
      background-color: #eaffea;
    }

    /* disabled */
    input:disabled {
      background-color: #ddd;
      cursor: not-allowed;
    }

    /* enabled */
    input:enabled {
      border-color: black;
    }

    /* placeholder-shown */
    input:placeholder-shown {
      border-color: red;
    }

    /* visited */
    a:visited {
      color: purple;
    }

    /* first-of-type */
    p:first-of-type {
      color: blue;
    }

    /* last-of-type */
    p:last-of-type {
      color: red;
    }

    /* nth-of-type */
    li:nth-of-type(2) {
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>Buttons</h2>
  <button>Hover & Click Me</button>

  <h2>Inputs</h2>
  <input type="text" placeholder="Click or Tab here">
  <br><br>
  <input type="text" placeholder="Disabled input" disabled>

  <h2>Links</h2>
  <a href="https://example.com" target="_blank">Visit this link</a>

  <h2>Paragraphs</h2>
  <p>First paragraph</p>
  <p>Middle paragraph</p>
  <p>Last paragraph</p>

  <h2>List</h2>
  <ul>
    <li>Item 1</li>
    <li>Item 2 (nth-of-type)</li>
    <li>Item 3</li>
  </ul>
  <ul>
    <li>Item 1</li>
    <li>Item 2 (nth-of-type)</li>
    <li>Item 3</li>
  </ul>

  <h2>Paragraphs</h2>
  <p>First paragraph</p>
  <p>Middle paragraph</p>
  <p>Last paragraph</p>

</body>
</html>
