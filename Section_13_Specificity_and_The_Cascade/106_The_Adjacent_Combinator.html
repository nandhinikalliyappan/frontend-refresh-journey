<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Adjacent Sibling Combinator Practice</title>

  <style>
    /* Adjacent Sibling Combinator */

    h2 + p {
      color: red;
      font-weight: bold;
    }

   
  </style>
</head>
<body>

  <h2>Section Title</h2>
  <p>This paragraph is selected (immediately after h2)</p>
  <p>This paragraph is NOT selected</p>

</body>
</html>
