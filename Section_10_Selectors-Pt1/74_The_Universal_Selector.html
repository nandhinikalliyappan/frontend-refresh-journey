<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Selector</title>
    <style>
        *{
            color: purple;
        }
    </style>
</head>

<body>
    <h1>This is an example for universal selector</h1>
    <p>This paragraph also becomes purple.</p>
    <span>Even span text becomes purple.</span>
</body>

</html>
