<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grouping Selector</title>
    <link rel="stylesheet" href="76_Grouping_Selectors.css">
</head>

<body>
    <h1>Example for group selector</h1>
    <h1>Welcome to My Website</h1>
    <h2>Latest Updates</h2>
    <h3>Today's News</h3>

    <p>This is a paragraph text.</p>
    <span>This is additional information.</span>

    <ul>
        <li>Update 1</li>
        <li>Update 2</li>
    </ul>

    <a href="#">Read More</a>
    <button>Click Me</button>


</body>

</html>
