<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>External styles</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <h1>Welcome to My Website</h1>
    <p>This paragraph is styled using an external CSS file.</p>


    <!-- External Styling Notes:

            External styling means writing all CSS rules in a separate .css file and linking it to the HTML document.

            Why use external CSS?
            - Best method for real projects and multi-page websites.
            - Keeps HTML file clean and easy to read.
            - Allows reusing the same stylesheet across many pages.

            Advantages:
            - Faster development and easier maintenance.
            - One change in the CSS file updates styling everywhere.
            - Better separation of structure (HTML) and design (CSS).

            Limitations:
            - Requires an additional file.
            - Pages may load slightly slower on first visit because the CSS file must be downloaded.

            Best practice:
            Always prefer external CSS for professional, scalable, and organized web development.

        -->

</body>

</html>
