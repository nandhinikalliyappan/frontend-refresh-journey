<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All About Headings</title>
</head>
<body>
    <h1>Main Heading</h1>
    <h2>Subheading Level 2</h2>
    <h3>Subheading Level 3</h3>
    <h4>Subheading Level 4</h4>
    <h5>Subheading Level 5</h5>
    <h6>Subheading Level 6</h6>


    <!-- Points to Remember When Using Heading Tags -->

    <!-- 1) Headings are used to represent different levels of titles or section headings. -->

    <!-- 2) h1 is the largest heading and h6 is the smallest. -->

    <!-- 3) h1 is usually reserved for the main topic of the page. 
            Technically, you can use multiple h1 tags, but from a semantic and structural perspective, 
            it’s best to have only one h1 per page. -->

    <!-- 4) There should be only one main topic on a page, 
            meaning there should ideally be only one h1 tag. -->

    <!-- 5) Headings should be used in hierarchical order — 
            for example, don’t use h6 if you haven’t used h4 or h5 before it. -->

    <!-- 6) Technically, browsers won’t enforce these rules, 
            but following them ensures a meaningful and accessible structure. -->

    <!-- 7) All headings should be used in logical order: h1, h2, h3, h4, h5, h6. -->

    <!-- 8) Proper use of headings helps create a well-structured and SEO-friendly web page. -->
</body>
</html>
