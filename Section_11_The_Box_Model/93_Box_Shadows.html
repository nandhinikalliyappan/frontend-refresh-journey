<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Box Shadow Variations</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .box {
            width: 200px;
            padding: 20px;
            margin: 30px auto;
            background: #fff;
            border-radius: 12px;
            border: 2px solid gray;
            text-align: center;
        }

        .light{
            box-shadow: 10px 10px 2px red;
        }
        
       .medium{
        box-shadow: 0 20px 3px blue;
       }

       .deep{
        box-shadow: -10px -10px 2px purple, 10px 10px 2px purple ;
       }


    </style>
</head>
<body>

    <div class="box light">Light Shadow</div>
    <div class="box medium">Medium Shadow</div>
    <div class="box deep">Deep Shadow</div>
    
</body>
</html>
