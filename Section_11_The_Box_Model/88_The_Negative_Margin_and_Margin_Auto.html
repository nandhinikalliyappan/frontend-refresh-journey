<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Negative Margin & Margin Auto</title>
    <style>
        /* Common styles for boxes */
        .box {
            width: 100px;
            height: 100px;
            color: white;
            text-align: center;
            line-height: 100px;
            margin: 10px;
            font-weight: bold;
            border: 10px black solid;
        }

        /* Negative margin example */
        .neg1 {
            background-color: lightblue;
            margin-bottom: -20px; /* pulls next element up */
            border: 10px black solid;
        }
        .neg2 {
            background-color: coral;
            border: 10px black solid;
        }

        /* Margin auto example */
        .auto {
            width: 150px;       /* required for centering */
            height: 100px;
            background-color: lightgreen;
            margin: 0 auto;     /* horizontally centers */
            text-align: center;
            border: 10px black solid;
        }
    </style>
</head>
<body>

    <h2>Negative Margin Example</h2>
    <div class="box neg1">Box 1</div>
    <div class="box neg2">Box 2</div>

    <h2>Margin Auto Example</h2>
    <div class="auto">Centered Box</div>

</body>
</html>
