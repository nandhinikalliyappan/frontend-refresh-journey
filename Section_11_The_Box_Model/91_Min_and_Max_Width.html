<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Min & Max Width Simple</title>
    <style>
        /* Single container with min and max width */
        .container {
            width: 60%; /* Base width */
            min-width: 200px; /* Minimum width */
            max-width: 500px; /* Maximum width */
            margin: 50px auto; /* Center horizontally */
            padding: 20px;
            border: 2px solid #4CAF50;
            background-color: #f0f8ff;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Responsive Box</h2>
        <p>Resize the browser to see min-width and max-width in action.</p>
    </div>
</body>

</html>
