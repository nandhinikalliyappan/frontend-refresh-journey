<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Border Radius Shapes</title>

    <style>
        .shape {
            margin: 20px auto;
            text-align: center;
            line-height: 60px;
            border: 2px solid #333;
        }

        /* Small rounded corners */
        .small-round {
            width: 200px;
            height: 60px;
            border-radius: 6px;
        }

        /* Large rounded corners */
        .large-round {
            width: 200px;
            height: 60px;
            border-radius: 20px;
        }

        /* Full circle */
        .circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            line-height: 100px;
        }

        /* Oval / pill shape */
        .oval {
            width: 200px;
            height: 60px;
            border-radius: 50px;
        }
    </style>
</head>
<body>

    <div class="shape small-round">Small Round</div>
    <div class="shape large-round">Large Round</div>
    <div class="shape circle">Circle</div>
    <div class="shape oval">Oval</div>

</body>
</html>
