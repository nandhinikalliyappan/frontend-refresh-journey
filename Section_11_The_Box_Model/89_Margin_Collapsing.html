<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Margin Collapsing Example</title>

    <style>
        .box1 {
            background-color: lightblue;
            margin-bottom: 70px;
            padding: 10px;
            border: 10px solid black;
        }

        .box2 {
            background-color: lightgreen;
            margin-top: 20px;
            padding: 10px;
                        border: 10px solid black;

        }
    </style>
</head>

<body>

    <div class="box1">
        Box 1 (margin-bottom: 40px)
    </div>

    <div class="box2">
        Box 2 (margin-top: 20px)
    </div>

</body>

</html>
