<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display None Example</title>
    <style>
        /* This element will be completely hidden */
        .hide {
            display: none;
        }

        .box {
            width: 100px;
            height: 100px;
            background-color: lightcoral;
            margin: 10px;
            text-align: center;
            line-height: 100px;
            color: white;
        }
    </style>
</head>
<body>
    <div class="box">Element 1</div>
    <div class="box hide">Element 2 (hidden)</div>
    <div class="box">Element 3</div>
</body>
</html>
