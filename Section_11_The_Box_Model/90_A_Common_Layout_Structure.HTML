<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Common Layout Example</title>

    <style>
        /* Common layout: vertically stacked items aligned together */
        .section {
            margin-left: 20px;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

    <h3 class="section">Profile</h3>
    <p class="section">Name: John</p>
    <p class="section">Email: john@example.com</p>
    <p class="section">Phone: 1234567890</p>

    <p>Contact Address - doesn't apply layout style</p>

</body>
</html>
