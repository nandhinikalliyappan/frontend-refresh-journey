<!DOCTYPE html>
<html>
<head>
    <title>Radio Button - another form control</title>
</head>
<body>
    <p>Radio button</p>
    <form action="">
    <label for="phone">Call me</label> 
    <input type="radio" id="phone" name="contact" value="phone">   
    <label for="email">Email me</label>
    <input type="radio" id="email" name="contact" value="email">
    <label for="message">Message me</label>
    <input type="radio" name="contact" id="message" value="message">
    <button>submit</button>
    </form>

    <!-- Notes on Radio Buttons:

        1) Radio buttons allow the user to choose ONLY one option from a group.
        2) All radio buttons in a group must share the same 'name' attribute.
        3) The 'value' attribute defines the data sent to the server when selected.
        4) Use 'checked' to set a default selected option.
        5) Common uses: gender, payment method, yes/no questions.
        -->


</body>
</html>
