<!DOCTYPE html>
<html>
<head>
    <title>Select - Another form control</title>
</head>
<body>
    <p>Examle for selects</p>
    <form action="">
        <label for="size">Select your size</label>
        <select name="size" id="size">
            <option value="s">small</option>
            <option value="m">Medium</option>
            <option value="l">large</option>
        </select>
        <button>submit</button>

        <!-- Notes on <select> element:

            1) <select> creates a dropdown menu for choosing one (or multiple) options.
            2) <option> tags inside it define the choices.
            3) The 'name' attribute is required to send the selected value during form submission.
            4) 'selected' sets the default option.
            5) Common uses: country list, gender, category selection.
            -->

    </form>
</body>
</html>
