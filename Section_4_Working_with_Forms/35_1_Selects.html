<!DOCTYPE html>
<html>
<head>
    <title>Select - Another form control</title>
</head>
<body>
    <p>Examle for selects</p>
    <form action="">
        <label for="size">Select your size</label>
        <select name="shirtsize" id="shirtsize">
            <option value="s">small</option>
            <option value="m">Medium</option>
            <option value="l">large</option>
        </select>
    </form>
    <button>submit</button>
</body>
</html>
