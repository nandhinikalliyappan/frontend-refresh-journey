<!DOCTYPE html>
<html>
<head>
    <title>All about input types</title>
</head>
<body>

     <p>Examle for text area</p>
     <Form>
       <textarea rows="10" cols="50" id="para"></textarea>
       <button>submit</button>
      </Form>
     <!-- Notes on <textarea> element:

        1) The <textarea> element is used when you want the user to enter 
        multi-line text (longer input than a normal text box).

        2) Unlike <inpust type="text"> which is single-line, 
        <textarea> allows multiple lines and auto-expands based on its size.

        3) You can control the visible size using:
            - rows: number of visible lines
            - cols: number of visible characters per line
        Example:
            <textarea rows="4" cols="40"></textarea>

        4) The content inside <textarea> becomes the default text:
            <textarea>Default text here</textarea>

        5) The 'name' attribute is used to identify the textarea data when the form is submitted.

        6) It supports attributes like:
            - placeholder → shows a hint
            - required → makes it mandatory
            - maxlength → limits characters
            - disabled / readonly → restrict user input

        7) Example usage:
            <form>
                <textarea name="message" placeholder="Enter your message" rows="5" required></textarea>
                <button type="submit">Send</button>
            </form>

        8) Commonly used for:
            - Comments
            - Feedback forms
            - Descriptions
            - Messages
        -->


</body>
</html>
