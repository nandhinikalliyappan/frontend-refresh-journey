<!DOCTYPE html>
<html>
<head>
    <title>Text input and buttons</title>
</head>
<body>
    
    <h1>Working with forms</h1>
    <input type="text">
    <button type = "submit">submit</button>

    <!-- Notes:
        1) <input type="text"> is used to create a single-line text field where users can enter text.

        2) It’s an inline element and can be styled using CSS (for example: width, padding, border).

        3) You can use attributes like:
        - placeholder → to show hint text inside the box
        - name → to identify the input when sending data
        - value → to set a default text

        4) <button> is used to create a clickable button.

        5) Common types for button:
        - type="submit" → submits the form data
        - type="reset" → resets all form fields
        - type="button" → general-purpose button (used with JavaScript)

        6) Both text inputs and buttons are essential parts of web forms for collecting and submitting user data.
    -->
</body>
</html>
