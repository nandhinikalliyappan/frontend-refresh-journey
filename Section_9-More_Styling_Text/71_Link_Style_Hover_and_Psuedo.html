<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link style</title>
    <style>

        /* Normal link (not visited yet) */
        a:link {
            color: blue;
            text-decoration: none;
            /* No underline */
        }

        /* Link already visited */
        a:visited {
            color: green;
        }

        /* When mouse is over the link */
        a:hover {
            color: red;
            text-decoration: underline;
            /* Add underline on hover */
        }
    </style>
</head>

<body>
    <h1>Example for link styling</h1>
    
    <a href="https://www.google.com">Nav1</a>
    <a href="https://www.gmail.com">Nav2</a>
    <a href="https://www.facebook.com">Nav3</a>
</body>

</html>
