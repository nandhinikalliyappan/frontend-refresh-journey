<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font shorthand</title>
    <style>
        body {
            font: normal 16px/1.6 "Roboto", sans-serif;
            color: #333;
            margin: 20px;
        }

        /* Heading */
        h1 {
            font: italic bold 32px/1.2 "Playfair Display", serif;
            color: #222;
        }
    </style>
</head>

<body>

    <h1>Welcome to My Website</h1>
    <p>
        This is a paragraph demonstrating how the font shorthand can simplify your CSS.
        Instead of writing font-style, font-weight, font-size, line-height, and font-family separately,
        you can combine them into a single line.
    </p>

</body>

</html>
