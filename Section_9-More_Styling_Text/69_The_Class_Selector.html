<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Class Selector</title>
    <style>
        .highlight {
            color: white;
            background-color: teal;
            font-weight: bold;
            font-size: 50px;
        }
    </style>
</head>

<body>
    <!-- Applying the class to HTML elements -->
    <p class="highlight">This paragraph is styled using the "highlight" class.</p>
    <div class="highlight">This is a div using the same class.</div>

</body>

</html>
