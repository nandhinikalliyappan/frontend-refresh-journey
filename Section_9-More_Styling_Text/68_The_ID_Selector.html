<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID Selector</title>
    <style>
        /* Styling the ID */
        #main-heading {
            color: blue;
            font-size: 28px;
            text-align: center;
        }

        #highlight {
            background-color: yellow;
            padding: 10px;
        }
    </style>
</head>

<body>
    <h1 id="main-heading">This is a Main Heading Styled with an ID</h1>

    <p id="highlight">This paragraph uses the ID "highlight".</p>

</body>

</html>
