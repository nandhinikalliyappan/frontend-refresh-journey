<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Example for linear Gradient</title>
    <style>
      p{
        height: 600px;
        width: 600px;
        background-image: linear-gradient(to top,blue,cyan);
        border-style: solid;
      }
    </style>
</head>
<body>
    <p>This is an example for linear gradient</p>
</body>
</html>
