<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Background Shorthand Property</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            
        }

        .box {
            height: 500px;
            margin: 40px;
            border: 4px solid black;

            /* BACKGROUND SHORTHAND */
            background: purple url("images/peacock.png") no-repeat left/contain;
        }
    </style>
</head>

<body>
    <div class="box">
        Background shorthand example
    </div>
</body>

</html>
