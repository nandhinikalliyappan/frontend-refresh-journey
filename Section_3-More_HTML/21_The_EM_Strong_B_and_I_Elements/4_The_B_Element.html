<!DOCTYPE html>
<html>
<head>
    <title>B Element</title>
</head>
<body>
    <p>This is an <b>html</b> course</p>

    <!-- Notes:
         1) The <b> element is used to draw attention to text without adding extra importance or emphasis.
         2) By default, browsers render <b> text in bold, but this can be customized using CSS.
         3) Use <b> when you want to highlight text visually (for example, keywords, product names, or UI labels)
            but not to indicate importance in meaning.
         4) The <b> element differs from <strong> — <strong> conveys semantic importance, 
            while <b> is purely for visual styling.
    -->
</body>
</html>
