<!DOCTYPE html>
<html>
<head>
        <title>Idiomatic Text Element</title>
</head>
<body>
    <p>I <i>really</i> need to go to bed</p>
    <!-- Notes:
         1) Use the <i> element to italicize text that has a different tone or mood,
            such as idiomatic phrases, technical terms, or foreign words.
         2) It is typically used for text that is traditionally italicized, 
            but doesn’t need semantic emphasis (unlike <em>).
         3) You can change the default italic style using CSS if needed.
    -->
    <h3>Another Example</h3>
    <p>I just saw a Moose <i>(Alces Alces)</i></p>
    </body>
</html>
