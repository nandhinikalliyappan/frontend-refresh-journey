<!DOCTYPE html>
<html>
<head>
    <title>Emphasis Element</title>
</head>
<body>
    <p>Just <em>do</em> it already!!</p>
    <!-- Notes:
         1) Use the <em> element when you want to emphasize or stress a word relative to the rest of the text.
         2) Most browsers render it in italics by default, but you can change this style using CSS.
         3) Don't use <em> just to italicize text — use it when the meaning of the sentence changes with emphasis.
    -->
   
</body>
</html>
