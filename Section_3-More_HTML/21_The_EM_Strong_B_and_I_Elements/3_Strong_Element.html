<!DOCTYPE html>
<html>
<head>
    <title>Strong Element</title>
</head>
<body>
    <p>Whatever you do <strong>do not let the cats out</strong></p>
    <!-- Notes:
         1) The <strong> element is similar to <em> (emphasis). Use it to indicate special
            significance or importance. By default, it will be displayed in bold by browsers,
            but you can change this style using CSS.
         2) Basically, the <strong> element indicates that its content has strong importance,
            seriousness, or urgency. Browsers render it in bold type by default.
         3) Don’t just use <strong> to make text bold. Use it when you want to emphasize that
            something is important or meaningful in context.
    -->
</body>
</html>
