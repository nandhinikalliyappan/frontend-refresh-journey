<!DOCTYPE html>
<html>
<head>
    <title>Creating Images</title>
</head>
<body>
    
    <img src="images/murugan.jpg" alt="Murugan images">

    <h3>Example for alt</h3>
    <img src="https://www.pinterest.com/pin/424323596163018592/" alt="Babymurugan">

        <!-- Notes:
            1) The <img> tag is used to embed images in a webpage.
            2) It is a self-closing tag (no closing </img> tag).
            3) The src attribute specifies the path or URL of the image.
            Example: src="images/murugan.jpg" (relative path)

            4) The alt attribute provides alternative text when the image cannot be displayed.
            - Helps visually impaired users (screen readers read it aloud)
            - Useful for SEO and accessibility
            - If the alt attribute is empty or missing, screen readers will skip the image completely.

            5) You can use local images (within your project folder) or external images (from the web).

            6) Image paths can be:
            - Relative → within the same website (e.g., images/murugan.jpg)
            - Absolute → full URL (e.g., https://example.com/pic.jpg)

            7) Browsers:
            - If the image fails to load, the browser displays the alt text instead.
            - If no alt text is provided, the browser shows a broken image icon.
            - Modern browsers cache images to improve loading speed.

            8) You can style images using CSS — set width, height, border, etc.

            9) Always optimize image size and format (like .jpg, .png, .webp) for faster page loading.
        -->

</body>
</html>
