<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Lists</title>
</head>
<body>
    <h1>Lists in HTML</h1>

    <h2>Example: Unordered List</h2>
    <h3>Recipe Ingredients</h3>
    <ul>
        <li>Chicken Breasts</li>
        <li>Parmesan Cheese</li>
        <li>Tomatoes</li>
    </ul>

    <!-- Points to Remember about Unordered Lists
         1) We use unordered lists when the items don’t need to follow a specific order.
         2) By default, unordered lists are displayed with bullet points.
         3) You can change the bullet style using the "list-style-type" property in CSS (e.g., circle, square, none).
    -->

    <h2>Example: Ordered List</h2>
    <h3>My To-Do List</h3>
    <ol>
        <li>Wake up early</li>
        <li>Do yoga</li>
        <li>Have a healthy breakfast</li>
        <li>Start coding practice</li>
        <li>Read about HTML concepts</li>
    </ol>

    <!-- Points to Remember about Ordered Lists
         1) We use ordered lists when the order or sequence of items matters.
         2) By default, ordered lists are numbered as 1, 2, 3, and so on.
         3) You can change the numbering style using the "type" attribute (e.g., A, a, I, i).
         4) You can start numbering from a specific value using the "start" attribute.
    -->

    <!-- Final Note:
         A list is really a group of connected elements 
         that are somehow tied together in a logical collection.
    -->
</body>
</html>
