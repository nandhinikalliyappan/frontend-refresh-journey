<!DOCTYPE html>
<html>
<head>
    <title>Creating Links(Absolute)</title>
</head>
<body>
    <a href="http://www.reddit.com">Go to reddit </a>

    <ul>
        <li ><a href="http://www.facebook.com">Go to Facebook</a></li>
        <li><a href="http://www.google.com">Go to Google</a></li>
    </ul>

    
    <!-- Notes:
        1) The <a> tag (anchor tag) is used to create hyperlinks in HTML.

        2) The href attribute specifies the destination URL or file path.

        3) Links can point to:
            - External websites (e.g., https://google.com)
            - Internal pages (e.g., about.html)
            - Sections within the same page (e.g., #top)

        4) Absolute links include the complete URL with protocol (http:// or https://).
           Example: <a href="https://www.example.com">Visit Example</a>

        5) Use absolute links when linking to external websites or pages hosted on a different domain.

        6) Use target="_blank" to open a link in a new browser tab.

        7) By default, links appear blue and underlined; visited links appear purple.

        8) Always use meaningful link text that clearly describes the destination.

        9) You can style links using CSS pseudo-classes:
           a:link, a:visited, a:hover, a:active -->

</body>
</html>
