<!DOCTYPE html>
<html>
<head>
    <title>Nesting Elements</title>
</head>
<body>
    <p>I'm a <em>Designer</em> and a <strong>engineer</strong></p>

    <!-- Notes:
         1) Nesting elements means placing one HTML element inside another.
         2) Here, <em> and <strong> are both nested inside a <p> element (paragraph).
         3) <em> adds emphasis to the word “Designer”, while <strong> gives importance to “Engineer”.
         4) Always ensure proper opening and closing of nested tags to maintain valid HTML structure.
         5) Inline elements like <em>, <strong>, <i>, and <b> can be nested inside block-level elements like <p>.
         6)The order of nesting matters — whichever tag opens first should close last.
            Example: <strong><em>text</em></strong> ✅  not <strong><em>text</strong></em>
    -->
</body>
</html>
