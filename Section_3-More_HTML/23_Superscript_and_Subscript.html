<!DOCTYPE html>
<html>
<head>
    <title>Superscript and Subscript</title>
</head>
<body>

    <h3>Example for SuperScript</h3>
    <h4>4 <sup>th</sup>of July</h4>

    <h3>Example for Subscript</h3>
    <h4>H <sub>2</sub> O </h4>

    <!-- Notes:
        1) <sup> tag is used to define superscript text — text that appears slightly above the 
            normal line.
            Example: mathematical powers, ordinal numbers (like 1st, 2nd, 3rd), etc.
        
        2) <sub> tag is used to define subscript text — text that appears slightly below the normal line.
           Example: chemical formulas (H2O, CO2), mathematical notations, etc.
        
        3) These tags are purely semantic and make the content more meaningful to browsers and 
            assistive technologies.
        
        4) You can style their position or appearance using CSS if needed.
    -->

</body>
</html>
