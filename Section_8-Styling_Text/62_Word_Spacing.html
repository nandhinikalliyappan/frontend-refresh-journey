<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Spacing</title>
    <style>
        .normal {
            word-spacing: normal;
            /* Default spacing */
        }

        .wide {
            word-spacing: 10px;
            /* Extra space between words */
        }

        .wider {
            word-spacing: 20px;
            /* Very wide spacing */
        }

        .compact {
            word-spacing: -2px;
            /* Words come closer */
        }
    </style>
</head>

<body>
    <h2>WORD SPACING EXAMPLES</h2>

    <p class="normal">This is normal word spacing.((normal))</p>

    <p class="wide">This is wide word spacing example.(10px)</p>

    <p class="wider">This is very wide word spacing example.(20px)</p>

    <p class="compact">This is compact word spacing example(-2px).</p>

    <!--WORD-SPACING
      - Controls the space between words.
      - Helpful when text looks cramped or to style headings.

    Example:
        p {
            word-spacing: 5px; /* adds extra space between words */
        } -->

</body>

</html>
