<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font family</title>
    <style>
        /* Example of font-family */
        p {
            font-family: "Poppins", Arial, sans-serif;
            font-size: 16px;
            color: darkblue;
        }
    </style>
</head>

<body>
    <p>This paragraph uses the Poppins font, with Arial and sans-serif as fallbacks.</p>

</body>

</html>
