<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adding custom fonts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Emilys+Candy&display=swap" rel="stylesheet">
    <style>
        p {
            font-family: "Emilys candy";
        }
    </style>
</head>

<body>
    <!--Example - 1 - Importing Custom Fonts Directly in HTML using link tag-->
    
    <h1>Welcome to My Google Fonts Page</h1>

    <p>
        This paragraph is styled using the "Emilys candy" font imported from Google Fonts.
        If Poppins is not available, the browser will use Arial, and if that fails,
        it will use a default sans-serif font.
    </p>
</body>

</html>
