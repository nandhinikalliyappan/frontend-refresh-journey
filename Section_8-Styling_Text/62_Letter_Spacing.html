<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .title {
            letter-spacing: 4px;
            /* Wide spacing */
        }

        .subtitle {
            letter-spacing: 1px;
            /* Small spacing */
        }

        .small-text {
            letter-spacing: 0.5px;
            /* Very small spacing */
        }

        .compact-text {
            letter-spacing: -1px;
            /* Letters become closer (negative spacing) */
        }
    </style>
</head>

<body>

    <h1 class="title">CSS LETTER SPACING(4px)</h1>
    <h3 class="subtitle">Improves readability(1px)</h3>
    <p class="small-text">This is an example paragraph with small spacing(0.5px).</p>
    <p class="compact-text">This text uses negative spacing(-1px).</p>

</body>

</html>
