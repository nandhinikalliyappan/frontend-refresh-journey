<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
</head>
<body>
    <p>Example for table</p>
    <table>
        <thead>
            <tr>
                <th>Item</th>
                <th>Quantity</th>
                <th>Price</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th>Coffee</th>
                <th>2</th>
                <th>$50</th>
            </tr>
            <tr>
                <th>Tea</th>
                <th>1</th>
                <th>$20</th>
            </tr>
            <tr>
                <th>Milk</th>
                <th>2</th>
                <th>$10</th>
            </tr>
        </tbody>
    </table>
</body>
</html>
