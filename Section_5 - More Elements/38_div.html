<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>divs</title>
</head>
<body>
    <p>Example for div</p>

    
        
    <!-- Notes on <div> element:

        1) <div> is a block-level container used to group larger sections of content
        such as headings, paragraphs, images, forms, or layout areas.

        2) Because it is block-level, <div> always starts on a new line and stretches
        to take the full width of its parent container.

        3) <div> does not show anything visually by default — it becomes useful only
        when styled using CSS (background, margin, padding, borders, flexbox, grid).

        4) Common uses:
            - Wrapping page sections (header, footer, sidebar, content area)
            - Creating layouts (rows, columns, cards)
            - Grouping related elements for better structure
            - Targeting a specific section with CSS or JavaScript

        5) <div> is a non-semantic element, which means it does not describe meaning,
        only structure. It is mainly used for layout and grouping.

        6) Classes and IDs are usually added to <div> for styling or scripting:
            <div class="card">...</div>

        7) Use <div> for bigger layout sections. For small inline text styling, use <span>.

        -->

</body>
</html>
