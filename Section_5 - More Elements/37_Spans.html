<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Span</title>
</head>
<body>
     
    <p>Example 1 — Styling part of a sentence</p>
    <p>This is a <span style="color:blue;">blue</span> word.</p>

    <p>Example 2 — Highlighting text</p>
    <p>Please read the <span style="background:yellow;">important note</span> carefully.</p>

    <!-- Notes on <span> element:

        1) <span> is an inline container used to wrap small pieces of text or inline elements so they can be
        styled or targeted with JavaScript without affecting the rest of the line.

        2) It has no default visual appearance — <span> does NOT change how text looks unless CSS is applied.

        3) Because it is an inline element:
            - It does NOT start on a new line.
            - It fits naturally inside a sentence.
            - It only takes up the width of its content.

        4) Common usage:
            <p>My favorite color is <span style="color:red">red</span>.</p>
        Here, only the word "red" is styled.

        5) <span> is useful for:
            - Styling specific words or phrases
            - Applying classes or IDs to part of a sentence
            - Targeting text with JavaScript
            - Grouping inline content without affecting layout

        6) Use <span> for small inline text sections.
        For larger structural blocks or layout purposes, use <div>.
    -->
</body>
</html>
